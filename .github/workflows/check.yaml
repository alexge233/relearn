on:
  push:
  pull_request:

name: check

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: install boost
        run: |
          sudo apt-get update
          sudo apt-get install -y libboost-serialization-dev libboost-system-dev

      - name: build
        run: |
          mkdir build
          cd build
          cmake .. -DBUILD_TESTS=ON
          make

      - name: run tests
        run: |
          cd build
          ctest --output-on-failure

      - name: run example 1
        run: |
          cd build 
          ./ex_gridworld_online 
          cd ..

      - name: run example 2
        run: |
          cd build 
          timeout 300 ./ex_gridworld_offline
          cd ..

      - name: run the games
        run: |
          cd build
          for game in access_control bandit bandit_ucb_gradient blackjack blackjack_monte_carlo cart_pole \
                      cliff_walking dyna_maze frozen_lake gamblers_problem maximization_bias mountain_car \
                      random_walk tic_tac_toe windy_gridworld; do
            echo "::group::$game"
            timeout 300 ./ex_$game
            echo "::endgroup::"
          done

  check-serialization:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: install boost
        run: |
          sudo apt-get update
          sudo apt-get install -y libboost-serialization-dev libboost-system-dev

      - name: build with boost serialization
        run: |
          mkdir build
          cd build
          cmake .. -DBUILD_TESTS=ON -DUSING_BOOST_SERIALIZATION=ON
          make

      - name: run tests
        run: |
          cd build
          ctest --output-on-failure

  # Apple Clang and its standard library (libc++), as on a Mac: Clang rejects some code
  # GCC only warns about (e.g., narrowing in braces), and libc++'s random distributions
  # give other numbers than libstdc++'s for the same seeds
  check-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: build with Apple Clang
        run: |
          clang++ --version
          mkdir build
          cd build
          cmake .. -DBUILD_TESTS=ON
          make

      - name: run tests
        run: |
          cd build
          ctest --output-on-failure

      - name: run the examples and the games
        timeout-minutes: 30
        run: |
          cd build
          for example in gridworld_online gridworld_offline access_control bandit bandit_ucb_gradient \
                         blackjack blackjack_monte_carlo cart_pole cliff_walking dyna_maze frozen_lake \
                         gamblers_problem maximization_bias mountain_car random_walk tic_tac_toe \
                         windy_gridworld; do
            echo "::group::$example"
            ./ex_$example
            echo "::endgroup::"
          done
