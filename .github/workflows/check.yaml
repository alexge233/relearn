on:
  push:
  pull_request:

name: check

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: the docs build on GitHub Pages
        run: |
          # Jekyll reads {{ and {% in Markdown as Liquid templates, so write C++ braces as { { ... } }
          ! grep -rn --include='*.md' -e '{{' -e '{%' .

      - name: install boost
        run: |
          sudo apt-get update
          sudo apt-get install -y libboost-serialization-dev libboost-system-dev

      - name: build
        run: |
          mkdir build
          cd build
          cmake .. -DBUILD_TESTS=ON
          make

      - name: run tests
        run: |
          cd build
          ctest --output-on-failure

      - name: run example 1
        run: |
          cd build 
          ./ex_gridworld_online 
          cd ..

      - name: run example 2
        run: |
          cd build 
          timeout 300 ./ex_gridworld_offline
          cd ..

      - name: watch a game, headless
        run: |
          cd build
          # the frames go to a file: the watch mode must run through, drawing with the 256-colour palette
          # (no COLORTERM here) and with 24-bit colour
          ./ex_cliff_walking --watch --delay 0 --every 10 > watched.txt
          test -s watched.txt
          COLORTERM=truecolor ./ex_frozen_lake --watch --delay 0 --every 10 > watched.txt
          grep -q $'\e\[38;2;' watched.txt

      - name: run the games
        run: |
          cd build
          for game in access_control bandit bandit_ucb_gradient blackjack blackjack_monte_carlo cart_pole \
                      cliff_walking cliff_walking_n_step dyna_maze dyna_maze_lambda dyna_maze_n_step \
                      dyna_maze_prioritized dynamic_programming frozen_lake frozen_lake_off_policy gamblers_problem importance_sampling \
                      maximization_bias mountain_car mountain_car_lambda racetrack random_walk random_walk_lambda random_walk_lambda_return \
                      random_walk_td short_corridor tic_tac_toe tic_tac_toe_mcts trajectory_sampling windy_gridworld; do
            echo "::group::$game"
            timeout 300 ./ex_$game
            echo "::endgroup::"
          done

  check-serialization:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: install boost
        run: |
          sudo apt-get update
          sudo apt-get install -y libboost-serialization-dev libboost-system-dev

      - name: build with boost serialization
        run: |
          mkdir build
          cd build
          cmake .. -DBUILD_TESTS=ON -DUSING_BOOST_SERIALIZATION=ON
          make

      - name: run tests
        run: |
          cd build
          ctest --output-on-failure

  # the window: the examples built with raylib as their screen (no display here, so they are only built)
  check-window:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Ubuntu only packages raylib in its newest releases, so it is built from source, as docs/watch.md says
      - name: install raylib
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev
          git clone --depth 1 --branch 6.2 https://github.com/raysan5/raylib.git
          cmake -S raylib -B raylib/build -DBUILD_SHARED_LIBS=ON -DBUILD_EXAMPLES=OFF -DGLFW_BUILD_WAYLAND=OFF
          cmake --build raylib/build -j4
          sudo cmake --install raylib/build

      - name: build the window examples
        run: |
          mkdir build
          cd build
          cmake .. -DBUILD_WINDOW=ON
          make win_cliff_walking win_windy_gridworld win_dyna_maze win_frozen_lake win_racetrack win_mountain_car win_cart_pole

  check-window-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: install raylib
        run: brew install raylib

      - name: build the window examples
        run: |
          mkdir build
          cd build
          cmake .. -DBUILD_WINDOW=ON
          make win_cliff_walking win_windy_gridworld win_dyna_maze win_frozen_lake win_racetrack win_mountain_car win_cart_pole

  # Apple Clang and its standard library (libc++), as on a Mac: Clang rejects some code
  # GCC only warns about (e.g., narrowing in braces), and libc++'s random distributions
  # give other numbers than libstdc++'s for the same seeds
  check-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: build with Apple Clang
        run: |
          clang++ --version
          mkdir build
          cd build
          cmake .. -DBUILD_TESTS=ON
          make

      - name: run tests
        run: |
          cd build
          ctest --output-on-failure

      - name: run the examples and the games
        timeout-minutes: 30
        run: |
          cd build
          for example in gridworld_online gridworld_offline access_control bandit bandit_ucb_gradient \
                         blackjack blackjack_monte_carlo cart_pole cliff_walking cliff_walking_n_step \
                         dyna_maze dyna_maze_lambda dyna_maze_n_step dyna_maze_prioritized \
                         dynamic_programming frozen_lake frozen_lake_off_policy gamblers_problem importance_sampling maximization_bias \
                         mountain_car \
                         mountain_car_lambda racetrack random_walk random_walk_lambda random_walk_lambda_return random_walk_td short_corridor \
                         tic_tac_toe tic_tac_toe_mcts trajectory_sampling windy_gridworld; do
            echo "::group::$example"
            ./ex_$example
            echo "::endgroup::"
          done
