on:
  push:
  pull_request:

name: check

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: install boost
        run: |
          sudo apt-get update
          sudo apt-get install -y libboost-serialization-dev libboost-system-dev

      - name: build
        run: |
          mkdir build
          cd build
          cmake .. -DBUILD_TESTS=ON
          make

      - name: run tests
        run: |
          cd build
          ctest --output-on-failure

      - name: run example 1
        run: |
          cd build 
          ./ex_gridworld_online 
          cd ..

      #- name: run example 2
      #  run: |
      #    cd build 
      #    ./ex_gridworld_offline
      #    cd ..

      #- name: run example 3: requires user input to stop
      #  run: |
      #    cd build 
      #    ./ex_blackjack
      #    cd ..

  check-serialization:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: install boost
        run: |
          sudo apt-get update
          sudo apt-get install -y libboost-serialization-dev libboost-system-dev

      - name: build with boost serialization
        run: |
          mkdir build
          cd build
          cmake .. -DBUILD_TESTS=ON -DUSING_BOOST_SERIALIZATION=ON
          make

      - name: run tests
        run: |
          cd build
          ctest --output-on-failure
